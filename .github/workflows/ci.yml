name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22.19.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Instalación limpia
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test -- --run --pool=forks --poolOptions.forks.singleFork=true
      - name: Lint
        run: npm run lint
      - name: Documentación
        run: npm run check:docs
      - name: Empaquetado reproducible
        run: npm pack --dry-run
